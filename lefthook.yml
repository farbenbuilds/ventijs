# Lefthook configuration: https://lefthook.dev/configuration/
# Install with `pnpm install`; run manually with
# `pnpm exec lefthook run pre-commit --all-files`.

min_version: 2.1.14
glob_matcher: doublestar

# A commit message must not carry a CI skip marker. GitHub matches one anywhere in a
# message, and a squash merge concatenates every commit body into the message on `main`,
# so a body that merely explains the marker silences every workflow on the next merge --
# and a skipped push starts no workflow that could report it. This is the only place the
# mistake is still catchable.
#
# `bump.yml` writes the marker into its own commit subject, and is unaffected: CI does
# not install these hooks.
commit-msg:
  commands:
    no-skip-marker:
      run: node scripts/check-commit-msg.mjs {1}

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,md,mdx,yaml,yml}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    - name: zig-fmt
      glob: "**/*.zig"
      run: zig fmt {staged_files}
      stage_fixed: true

    - name: zon2nix
      glob: "**/build.zig.zon"
      run: scripts/zon2nix.sh

    - name: conventions
      run: node scripts/check-conventions.mjs

    - name: hygiene
      exclude:
        - ".agents/**"
      run: scripts/check-staged.sh {staged_files}

    - name: typecheck
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm typecheck

    - name: tests
      glob: "**/*.{ts,tsx,mts,cts}"
      run: pnpm test
