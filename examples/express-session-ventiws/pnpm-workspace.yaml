# The example is its own workspace root: without this file, a `pnpm install` run
# inside it resolves the repository workspace above instead. The excludes admit
# the newest published dependencies through pnpm's 24-hour supply-chain window,
# because tracking the latest releases is the example's job.
minimumReleaseAgeExclude:
  - ventiws
  - "@ventiws/binding-*"
  - "@types/node"
  - express
  - express-session
  - "@types/express"
  - "@types/express-session"
