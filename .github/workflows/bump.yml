name: Bump

# A merge advances the version, commits it, and pushes the release tag. The tag is pushed
# with the release app's installation token, not `GITHUB_TOKEN`: a `GITHUB_TOKEN` push
# starts no workflow run, and the tag trigger is the only way into `publish.yml`.
on:
  push:
    branches:
      - main
  # The manual lever. With no inputs it finishes a run that failed before its commit; the
  # inputs apply the same directive a pull request label would, so a stable release can be
  # cut from `main` as it stands. A dispatch follows the merge rule: an untagged version in
  # the tree is released as written, and one that already shipped advances.
  workflow_dispatch:
    inputs:
      base:
        description: Base version bump
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      preid:
        description: Prerelease train
        type: choice
        options:
          - auto
          - alpha
          - beta
          - rc
          - stable
        default: auto

permissions:
  contents: write
  # To read the merged pull request's `release:*` labels.
  pull-requests: read

# Two merges in quick succession both rewrite `package.json`, and the second would advance
# a version the first never recorded. Queued rather than cancelled, because a cancelled run
# that had already pushed leaves the next one to bump a tree it did not see.
concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, tag, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The commit this job makes lands on `main` and starts this workflow again. The marker
    # in its subject is the loop guard, and `startsWith` rather than a search because a
    # squash merge puts every commit body into the message on `main`.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # `bump-version` scans `git log` for the previous bump commit; a depth-1 checkout
          # has none and writes no changelog section.
          fetch-depth: 0
          # `bump-version` also asks whether the tree's version is tagged; without tags a
          # released version looks unpublished and its merge publishes nothing.
          fetch-tags: true
          # No persisted `GITHUB_TOKEN` credential: its Authorization header would
          # authenticate the tag push below, and a `GITHUB_TOKEN` push starts no run.
          persist-credentials: false

      # A push run reads the directive from the merged pull request's labels; a dispatch run
      # reads it from its inputs. Both paths end at one kinds string for the bump. A
      # `release:skip` label ends it at a skip instead: the merge still lands, and no
      # version, commit, or tag is written for it.
      - name: Read the release directive
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ inputs.base }}
          PREID: ${{ inputs.preid }}
        run: |
          kinds=""
          skip="false"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${BASE}" ] && [ "${BASE}" != "auto" ]; then kinds="${BASE}"; fi
            if [ -n "${PREID}" ] && [ "${PREID}" != "auto" ]; then kinds="${kinds:+${kinds},}${PREID}"; fi
          fi
          if [ -z "${kinds}" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            labels=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name' 2>/dev/null || true)
            if printf '%s\n' "${labels}" | grep -qx 'release:skip'; then skip="true"; fi
            kinds=$(printf '%s\n' "${labels}" | sed -n 's/^release:\(major\|minor\|patch\|alpha\|beta\|rc\|stable\)$/\1/p' | paste -sd, -)
          fi
          echo "kinds=${kinds}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          suffix=""
          if [ "${skip}" = "true" ]; then suffix=" (skipped)"; fi
          echo "release directive: ${kinds:-default}${suffix}"

      # The checkout keeps the default `GITHUB_TOKEN` on purpose: the bump commit reaches
      # `main` without starting a second round of CI, and only the tag push needs a
      # credential that triggers runs.
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.release.outputs.skip != 'true'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Advance the version
        id: bump
        if: steps.release.outputs.skip != 'true'
        env:
          KINDS: ${{ steps.release.outputs.kinds }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A re-run after a run that pushed the bump commit but lost the tag push finds its
          # own commit at HEAD; bumping again would skip a version.
          if [ "$(git log -1 --format=%s)" = "chore(release): v$version" ]; then
            echo "version $version is already committed"
          elif [ -n "${KINDS}" ]; then
            node scripts/bump-version.mjs --release "${KINDS}"
          else
            node scripts/bump-version.mjs
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit the version
        if: steps.release.outputs.skip != 'true'
        env:
          # Through the environment: a version string is manifest data, and manifest data
          # interpolated into a `run:` line is shell input.
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run that found its own commit at HEAD has nothing to commit; failing on a
          # no-op would page for it.
          if git diff --quiet; then
            echo "version already committed"
            exit 0
          fi
          # No CI skip marker here, deliberately: GitHub reads one anywhere in a tagged
          # commit's message, and this commit is what a release tag will point at.
          git add package.json build.zig.zon README.md CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          # A merge landing during this job makes the push a non-fast-forward. Rebasing
          # onto it is a rebase of four lines onto a tree that did not touch them.
          git pull --rebase origin main
          # The default token authenticates this push, which is what keeps it silent: only
          # the tag push below should start a run.
          git push "https://x-access-token:${BRANCH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Tag the version
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: v${{ steps.bump.outputs.version }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          # A re-run after a lost tag push finds the tag already there; the publish run it
          # started is re-run from its own page, not by pushing the tag again.
          if git ls-remote --tags "$remote" "refs/tags/$TAG" | grep -q .; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push "$remote" "refs/tags/$TAG"
