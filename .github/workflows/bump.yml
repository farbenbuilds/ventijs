name: Bump

# A merge advances the version, commits it, and pushes the release tag. The tag is pushed
# with the release app's installation token, not `GITHUB_TOKEN`: a `GITHUB_TOKEN` push
# starts no workflow run, and the tag trigger is the only way into `publish.yml`.
on:
  push:
    branches:
      - main
  # The escape hatch. A run that failed before its commit leaves `main` unbumped, and this
  # advances the version without waiting for the next merge. A re-run after the commit but
  # before the tag finds its own commit at HEAD and only pushes the tag.
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession both rewrite `package.json`, and the second would advance
# a version the first never recorded. Queued rather than cancelled, because a cancelled run
# that had already pushed leaves the next one to bump a tree it did not see.
concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump, tag, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The commit this job makes lands on `main` and starts this workflow again. The marker
    # in its subject is the loop guard, and `startsWith` rather than a search because a
    # squash merge puts every commit body into the message on `main`.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # `bump-version` scans `git log` for the previous bump commit; a depth-1 checkout
          # has none and writes no changelog section.
          fetch-depth: 0
          # No persisted `GITHUB_TOKEN` credential: its Authorization header would
          # authenticate the tag push below, and a `GITHUB_TOKEN` push starts no run.
          persist-credentials: false

      # The checkout keeps the default `GITHUB_TOKEN` on purpose: the bump commit reaches
      # `main` without starting a second round of CI, and only the tag push needs a
      # credential that triggers runs.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Advance the counter
        id: bump
        run: |
          version=$(node -p "require('./package.json').version")
          # A re-run after a run that pushed the bump commit but lost the tag push finds its
          # own commit at HEAD; bumping again would skip a version.
          if [ "$(git log -1 --format=%s)" = "chore(release): v$version" ]; then
            echo "version $version is already committed"
          else
            node scripts/bump-version.mjs
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit the version
        env:
          # Through the environment: a version string is manifest data, and manifest data
          # interpolated into a `run:` line is shell input.
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run that found its own commit at HEAD has nothing to commit; failing on a
          # no-op would page for it.
          if git diff --quiet; then
            echo "version already committed"
            exit 0
          fi
          # No CI skip marker here, deliberately: GitHub reads one anywhere in a tagged
          # commit's message, and this commit is what a release tag will point at.
          git add package.json build.zig.zon README.md CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          # A merge landing during this job makes the push a non-fast-forward. Rebasing
          # onto it is a rebase of four lines onto a tree that did not touch them.
          git pull --rebase origin main
          # The default token authenticates this push, which is what keeps it silent: only
          # the tag push below should start a run.
          git push "https://x-access-token:${BRANCH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Tag the version
        env:
          TAG: v${{ steps.bump.outputs.version }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          # A re-run after a lost tag push finds the tag already there; the publish run it
          # started is re-run from its own page, not by pushing the tag again.
          if git ls-remote --tags "$remote" "refs/tags/$TAG" | grep -q .; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push "$remote" "refs/tags/$TAG"
