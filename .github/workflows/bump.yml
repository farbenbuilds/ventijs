name: Bump and release

# A merge to `main` is a release. The version advances, the tag is created, and the tag is
# what `publish.yml` listens for, so nothing here needs a machine that can authenticate to
# npm or push a tag by hand.
on:
  push:
    branches:
      - main
  # The escape hatch. A run that failed after the version commit and before the tag leaves
  # `main` bumped but untagged, and this is how that is finished without waiting for the
  # next merge. It is idempotent: both steps below no-op when there is nothing to do.
  workflow_dispatch:

permissions:
  contents: write
  # To start the publish run. A push made with `GITHUB_TOKEN` deliberately creates no
  # workflow run, so the tag this job pushes is invisible to `publish.yml`'s `push` trigger
  # and the release would end at a tag with nothing on npm. `workflow_dispatch` and
  # `repository_dispatch` are the two documented exceptions to that suppression.
  actions: write
  # Because this workflow dispatches the one that publishes. npm validates a trusted
  # publisher against the *calling* workflow's filename, so `id-token: write` is required
  # here as well as in `publish.yml`; without it the child has no OIDC token to exchange and
  # `npm publish` fails with ENEEDAUTH.
  id-token: write

# Two merges in quick succession both rewrite `package.json`, and the second would tag a
# version the first never tagged. Queued rather than cancelled, because a cancelled run
# that had already pushed would leave the next one to bump a version that was never
# released -- and a tag is what publishes, so that is a version on npm nobody chose.
concurrency:
  group: bump-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, tag, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The commit this job makes lands on `main` and starts this workflow again. The marker
    # in its subject is the loop guard, and `startsWith` rather than a search because a
    # squash merge puts every commit body into the message on `main`, where a body that
    # merely *describes* the prefix would read as a release.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The tag step has to know whether this version was already tagged, and a shallow
          # clone has no tags to compare against.
          fetch-depth: 0

      - name: Advance the counter
        id: bump
        run: |
          node scripts/bump-version.mjs
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A re-run after a superseded push finds the version already advanced. Failing
          # here would page for a no-op, and the tag step below still has work to do.
          if git diff --quiet; then
            echo "version already advanced"
            exit 0
          fi
          # No CI skip marker here, deliberately. This commit is what the tag points at, and
          # GitHub reads a marker anywhere in a tagged commit's message -- so a tagged bump
          # carrying one would skip `publish.yml` and publish nothing, silently. Saving a few
          # minutes of runner time is not worth a release that does not happen.
          git add package.json build.zig.zon README.md CHANGELOG.md
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          # A merge landing during this job makes the push a non-fast-forward. Rebasing onto
          # it is a rebase of four lines onto a tree that did not touch them.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Tag the version
        env:
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          # Idempotent, so a re-run finishes a run that failed between the two steps rather
          # than refusing on a tag it is looking at. `check-release-tag` still refuses a tag
          # that disagrees with the manifest it is cut from.
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tagged $TAG"

      - name: Start the publish run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.bump.outputs.version }}
        run: |
          # Dispatched at the tag rather than at the branch, so `github.ref` is the tag ref and
          # every gate in publish.yml already holds: the tag-against-version check runs, the
          # dry-run guards do not (no input is passed), and the release job waits for the
          # publish result. Nothing in that workflow had to change to be startable this way.
          #
          # The tag is already pushed, so this is not what makes the release real; it is what
          # makes the release happen. Re-dispatch it by hand if this step is ever the only
          # thing that failed.
          gh workflow run publish.yml --ref "$TAG"
          echo "dispatched publish.yml at $TAG"
