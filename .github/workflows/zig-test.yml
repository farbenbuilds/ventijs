name: Zig Test

on:
  push:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.dist-types.json"
      - "tsdown.config.ts"
      - ".github/workflows/zig-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.zig"
      - "build.zig"
      - "build.zig.zon"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tsconfig.dist-types.json"
      - "tsdown.config.ts"
      - ".github/workflows/zig-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Zig unit tests
    runs-on: ubuntu-24.04
    environment:
      name: Zig Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Run Zig unit tests
        run: zig build test --summary all

  binding:
    name: Binding lifecycle tests
    runs-on: ubuntu-24.04
    environment:
      name: Binding Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Check the built declarations
        run: pnpm exec tsdown && pnpm run typecheck:dist

      - name: Run binding lifecycle tests
        # These files load the addon, so each one builds and tears down a real
        # engine server. Running them in parallel makes engine server creation
        # fail intermittently on this host: measured over six runs, the parallel
        # invocation failed one to three tests every time while the same
        # invocation with --no-file-parallelism passed 96 of 96 five times out of
        # five. The failure is an engine-init resource error, not a test
        # assertion, and it predates the current suite. Serialising is the fix
        # until the engine's initialisation is safe to run concurrently.
        run: pnpm exec vitest run --no-file-parallelism tests/binding tests/compat/socket tests/compat/stream.test.ts tests/conformance
