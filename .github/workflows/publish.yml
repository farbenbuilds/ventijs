name: Publish

# The tag is the release decision, and the only way in: `bump.yml` pushes it with the
# release app's installation token, because a tag pushed with `GITHUB_TOKEN` starts no run.
# `pnpm release` remains the hand-pushed path.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# A publish that is part way through uploading cannot be recalled, so a second run for the
# same ref waits rather than cancelling the first.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bindings:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # One shard failing must not cancel the others: the publish job reports every missing
      # platform by name, which is the diagnosis.
      fail-fast: false
      matrix:
        include:
          # One runner per published platform, native for that platform. The engine builds
          # its vendored BoringSSL and lsquic for the host, so a cross build links a foreign
          # library and misbehaves later, which no green pipeline catches.
          - name: linux-x64-gnu
            os: ubuntu-24.04
            platform: linux-x64-gnu
          - name: linux-arm64-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
          - name: darwin-x64
            os: macos-15-intel
            platform: darwin-x64
          - name: darwin-arm64
            os: macos-15
            platform: darwin-arm64
          # No win32-x64 shard: napi-zig 0.2.8 asks for an ABI-less x86_64-windows-none
          # target that cannot link ws2_32. src/builds/platforms.zig records the reason.
    environment:
      name: Release
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ matrix.platform }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ matrix.platform }}-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the platform package
        run: node scripts/build-bindings.mjs --platform=${{ matrix.platform }}

      - name: Prove the addon loads on this platform
        # Load the artifact this shard built and round-trip frames through it. A package
        # published on compilation alone is a package nobody loaded.
        run: pnpm exec vitest run --no-file-parallelism tests/binding/addon.test.ts tests/binding/codec

      - name: Upload the platform package
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.name }}
          path: npm/ventiws
          include-hidden-files: true
          if-no-files-found: error

  bindings-musl:
    name: linux-x64-musl
    runs-on: ubuntu-24.04
    # A musl host, or the addon links glibc into an Alpine binary. node:24-alpine already
    # carries a Node the JavaScript actions can run.
    container: node:24-alpine
    timeout-minutes: 120
    environment:
      name: Release
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        run: |
          apk add --no-cache curl xz
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz \
            | tar -xJ -C /opt
          echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-linux-x64-musl-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-linux-x64-musl-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the platform package
        run: node scripts/build-bindings.mjs --platform=linux-x64-musl

      - name: Prove the addon loads on this platform
        # The one job where the loader's libc probe decides between two package names, so it
        # is also the only place a wrong gnu/musl answer would be caught.
        run: pnpm exec vitest run --no-file-parallelism tests/binding/addon.test.ts tests/binding/codec

      - name: Upload the platform package
        uses: actions/upload-artifact@v4
        with:
          name: bindings-linux-x64-musl
          path: npm/ventiws
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [bindings, bindings-musl]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # No npm secret anywhere: `id-token` is the whole credential, and npm exchanges this
    # run's OIDC token for a short-lived publish token and signs provenance with the same
    # token. Trusted publishing is configured per package against this filename and the
    # `npm` environment, so no other workflow can publish even holding a valid token.
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - name: Install the publish client
        # pnpm 11+ strips the bundled npm from the Node runtime, so the npm on PATH is the
        # runner image's npm 10, which predates trusted publishing entirely; `napi-zig
        # publish` shells out to that client. Install the one the registry exchanges.
        run: |
          pnpm add -g npm@^12
          echo "node $(node --version)"
          echo "npm  $(npm --version) at $(which npm)"

      - name: Download every platform package
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          # Each shard contributes its own `@ventiws/binding-*` directory and an identical
          # scaffolded `package.json`, so merging on top of each other assembles the one
          # package the loader resolves against.
          merge-multiple: true
          path: npm/ventiws

      - name: Check the tag against the version
        # A hand-pushed tag that disagrees with the manifest publishes nothing: npm uses the
        # manifest version, not the tag.
        run: node scripts/check-release-tag.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the bundle
        # No host addon on this runner, and none is needed: the release ships the platform
        # packages, and tsdown copies an artifact only when a build produced one.
        run: pnpm exec tsdown

      - name: Check the built declarations
        run: pnpm run typecheck:dist

      - name: Assemble the packages
        run: pnpm run stage:publish

      - name: Pack the tarballs
        # `napi-zig publish` packs its own tarballs and deletes each one, so a real run
        # leaves nothing to inspect. Packing here also makes these archives what a failed
        # publish is reviewed with.
        run: |
          mkdir -p pnpm-pack
          for dir in npm/ventiws npm/ventiws/@ventiws/*; do
            (cd "$dir" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/pnpm-pack")
          done
          ls -l pnpm-pack

      - name: Publish to npm
        # Bindings first, main package last, so the registry never points at a binding that
        # is not there yet.
        run: pnpm exec napi-zig publish

      - name: Upload the packed tarballs
        # `always()` because a failed publish is exactly when someone wants to see what was
        # about to go out.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: pnpm-pack
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [bindings, bindings-musl, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The page is written only for a tag whose publish succeeded: a page for a version that
    # is not on the registry advertises an install that fails. `contents: write` and no
    # OIDC grant, so the job that writes a page cannot publish.
    permissions:
      contents: write
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The notes are the changelog sections between this tag and the previous one, so
          # the earlier tag has to be present locally.
          fetch-depth: 0

      - name: Write the release notes
        run: node scripts/release-notes.mjs release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ventiws
          TAG: ${{ github.ref_name }}
        run: |
          # A prerelease is marked as one, so the release list does not present an alpha as
          # the newest stable thing.
          flags=(--title "$PKG $TAG" --notes-file release-notes.md --verify-tag)
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}"
