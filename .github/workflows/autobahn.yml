name: Autobahn

on:
  push:
    branches:
      - main
    # Only the engine can change RFC 6455 behaviour, so only a Zig source, a
    # build manifest, the harness, or the toolchain may start this job.
    #
    # An earlier version also matched `src/**`, which subsumed `**.zig` and
    # additionally matched every TypeScript file. That meant a change to the
    # `ws`-shaped facade, which the suite never exercises, still spent 38 minutes
    # of runner time re-measuring something it cannot observe. `**.zig` already
    # covers `src/**/*.zig`; `build.zig.zon` does not match `**.zig` and is
    # listed because it pins the engine and its vendored dependencies.
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tests/autobahn/**"
      - ".github/workflows/autobahn.yml"
  pull_request:
    branches:
      - main
    # The same filter as `push`, and the same reasoning. It is necessary but not
    # sufficient on its own: GitHub evaluates `paths` against the whole pull
    # request diff, so a branch that already touched the engine starts this job on
    # every later push. The `gate` job below closes that gap.
    paths:
      - "**.zig"
      - "build.zig.zon"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "tests/autobahn/**"
      - ".github/workflows/autobahn.yml"
  schedule:
    # Weekly, off the hour, so the RFC 6455 report is refreshed even when no
    # pull request touches the engine.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobahn-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the suite needs to run, in about 25 seconds and with no
  # toolchain beyond Node: a checkout with full history and a diff against the
  # last commit the suite ran on this ref.
  #
  # This is a separate job rather than a conditional step on purpose. A skipped
  # step inside the suite job would render that job green, indistinguishable from a
  # pass; a skipped *job* renders grey with the reason in the checks UI, and the
  # required check is still satisfied.
  #
  # A gate job that *fails* -- no Node, no git history, a crash -- leaves the
  # suite skipped rather than failed, which reads the same as a deliberate skip.
  # That cannot be fixed from inside the step, because a failing step publishes no
  # outputs at all. The mitigation is that this job is itself a check, so its
  # failure is visible; add it to branch protection alongside the suite.
  gate:
    name: Autobahn engine gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The decision is a diff against the watermark, so the history has to
          # reach it. A shallow clone would make `git diff` fail, and the script
          # answers that by running the suite rather than by skipping it.
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          install: false

      - name: Restore the last tested commit
        uses: actions/cache/restore@v4
        with:
          path: .autobahn-watermark
          # The key carries the commit, because a cache key is immutable and a
          # fixed one would freeze the watermark at the first commit ever
          # recorded. The prefix lookup resolves to the most recently created
          # match, which is the newest tested commit on this ref.
          key: autobahn-watermark-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            autobahn-watermark-${{ github.ref_name }}-
          lookup-only: true
          fail-on-cache-miss: false

      - name: Decide whether the engine moved
        id: decide
        run: |
          mkdir -p .autobahn-out
          node tests/autobahn/diff-gate-cli.ts | tee .autobahn-out/decision
          # The whole `run=<value>` line goes to the output file, not the value
          # alone: a bare `true` there is rejected as an invalid format, and it
          # reads as a green step until the suite is silently skipped.
          grep '^run=' .autobahn-out/decision >> "$GITHUB_OUTPUT"
          grep '^reason=' .autobahn-out/decision | cut -d= -f2- >> "$GITHUB_STEP_SUMMARY"

  fuzzing-client:
    name: RFC 6455 conformance
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # The critical path is the suite plus roughly 160s of setup. The budget is
    # set by the cold-build path rather than the warm one: the Zig cache key
    # hashes `build.zig`, `build.zig.zon`, and `src/builds/**`, and a change to
    # any of them with no prefix fallback available compiles BoringSSL, lsquic,
    # libdeflate, and zlib from source, which is minutes on its own. Unchanged
    # from `main` on purpose: sharding cut the suite, but nothing on this side cut
    # the build.
    timeout-minutes: 60
    environment:
      name: Autobahn
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Check the addon loads
        # Cheap and first, because a runtime that cannot load the addon is the
        # only pre-suite failure mode that would otherwise be discovered after a
        # full sharded suite. See tests/autobahn/preflight.ts.
        run: node tests/autobahn/preflight.ts

      - name: Pull the digest-pinned fuzzing client
        # Pulled before the gate so an unpullable reference fails here with a
        # clear message rather than surfacing as a protocol failure.
        run: docker pull crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074

      - name: Run the suite
        # Four concurrent fuzzing clients against four targets, in one job that
        # builds the addon once.
        #
        # The suite is most of the job and its cost is a near-constant per case
        # inside the Python client rather than anything on the Node or Zig side.
        # A matrix of four *jobs* would cut wall clock the same way but pay the
        # addon build four times, so it is sharded in-process instead.
        #
        # The per-case `duration` the report carries stays raw in summary.json,
        # so the next run can re-derive the shard weights from a measurement
        # rather than from a derivation.
        env:
          AUTOBAHN_SHARDS: "4"
        # Every run is the full 517-case selection. The target negotiates
        # permessage-deflate, so the two deflate groups are measured rather than
        # reported UNIMPLEMENTED, and the scheduled and manual runs remain the
        # weekly refresh of the report.
        run: node tests/autobahn/run.ts --full

      - name: Record the tested commit
        if: success()
        run: echo "${{ github.sha }}" > .autobahn-watermark

      - name: Save the tested commit for the gate
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .autobahn-watermark
          key: autobahn-watermark-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: tests/autobahn/reports
          if-no-files-found: warn
          retention-days: 30
