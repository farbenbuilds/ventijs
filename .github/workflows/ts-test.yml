name: TypeScript Test

on:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and boundary tests
    runs-on: ubuntu-24.04
    environment:
      name: TS Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      # The addon is built here after all, and the reason is a suite that started
      # needing it. `normalizeServerOptions` reads the codec's compiled ceilings so a
      # `maxPayload` above what the build supports is refused by name at construction,
      # and that read loads the addon. The read is lazy -- an option that was not set
      # never loads it -- so a caller who sets neither `maxPayload` nor
      # `maxFragments` touches no native code, but the suite still has to prove the
      # refusal, and it cannot without a binary.
      #
      # The cold path is minutes, because it compiles BoringSSL, lsquic, libdeflate,
      # and zlib from source. The cache key is the one zig-test.yml uses, for this
      # commit's build inputs, so whichever of the two jobs gets there first pays it
      # and the other restores it. Dropping these two suites back out of the addon
      # would put that cost back on the TS-only pull request, which is what this job
      # exists to avoid.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false

      - name: Restore Zig caches
        uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            zig-pkg
          key: zig-0.16.0-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/builds/**') }}
          restore-keys: |
            zig-0.16.0-${{ runner.os }}-${{ github.repository }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the native addon
        run: pnpm build:binding

      - name: Unit tests
        # The suites that are pure protocol arithmetic and option normalization, with
        # the addon available because normalization now reads a compiled ceiling. The
        # binding job in zig-test.yml runs the whole suite, so the inclusion here is
        # about *fast feedback* on a pull request that touched neither Zig nor the
        # addon, not about coverage: anything missed from this list is still run
        # there. It is an inclusion list on purpose, because an exclusion list has to
        # be edited every time a suite starts needing the addon, and a suite that is
        # missed fails here on a missing addon, which reads as a broken test rather
        # than a misplaced one.
        run: pnpm exec vitest run tests/protocol tests/compat/options
