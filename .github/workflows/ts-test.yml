name: TypeScript Test

on:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and boundary tests
    runs-on: ubuntu-24.04
    environment:
      name: TS Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        # The native addon is not built in this job, and every suite that builds a
        # WebSocket needs it: the frame codec is in the addon, so a facade socket
        # cannot even be attached without one. That is everything under
        # `tests/compat` except option normalisation, all of `tests/conformance`, and
        # all of `tests/binding`. The binding job in zig-test.yml runs the whole
        # suite, addon and all.
        #
        # The paths are named by inclusion for the same reason the old list was named
        # by exclusion and then went stale: an exclusion list has to be edited every
        # time a suite starts needing the addon, and a suite that is missed fails here
        # on a missing addon, which reads as a broken test rather than a misplaced
        # one. An inclusion list only needs editing when a suite genuinely stops
        # needing one, and a new suite is in the binding job by default.
        run: pnpm exec vitest run tests/protocol tests/compat/options
