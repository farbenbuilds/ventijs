name: TypeScript Test

on:
  push:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.mts"
      - "**.cts"
      - "**.js"
      - "**.jsx"
      - "**.mjs"
      - "**.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/ts-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit and boundary tests
    runs-on: ubuntu-24.04
    environment:
      name: TS Test
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        # The native addon is not built in this job, so every suite that attaches
        # to a native connection stays out: the binding lifecycle tests, the compat
        # facade suite that adopts one, and the whole `ws` parity set, which
        # compares a native-attached ventijs socket against `ws` and so needs a
        # real server on both sides. The binding job in zig-test.yml runs them.
        #
        # The list is per file, so a new conformance suite that adopts a native
        # connection has to be added here as well. It fails in this job on a
        # missing addon if it is not, which reads as a broken test rather than a
        # misplaced one; the binding job in zig-test.yml runs all of them.
        run: >-
          pnpm exec vitest run
          --exclude 'tests/binding/**'
          --exclude 'tests/compat/socket/**'
          --exclude 'tests/compat/stream.test.ts'
          --exclude 'tests/conformance/close.conformance.test.ts'
          --exclude 'tests/conformance/control.conformance.test.ts'
          --exclude 'tests/conformance/send-after-close.conformance.test.ts'
